<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuk-Tuk Driver Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="auth-container">
        <h2>Driver Login / Sign Up</h2>
        <input type="email" id="email" placeholder="Email Address"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <button onclick="signUp()">Register as New Driver</button>
        <button onclick="signIn()">Driver Log In</button>
    </div>


    <script>
        const SUPABASE_URL = "{{ SUPABASE_URL }}";
        const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
        
        // Fix: Rename instance variable to avoid naming collisions
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. SIGN UP
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Fix: Supabase expects 'email' key
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("Error signing up: " + error.message);
            else {
                alert("Sign up successful! Please check your email or log in.");
            }
        }

        // 2. SIGN IN
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Fix: Passing correctly defined variables
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Login failed: " + error.message);
            } else {
                const token = data.session.access_token;
                localStorage.setItem('driver_token', token);
                window.location.href = "/dashboard";
            }
        }
    </script>
</body>
</html>
