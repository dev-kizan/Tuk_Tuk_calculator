<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuk-Tuk Driver Tracker - Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-white min-h-screen flex flex-col justify-center items-center px-4">

    <div id="auth-container" class="max-w-md w-full space-y-6">
        <div class="text-center space-y-2">
            <span class="font-extrabold text-3xl tracking-tight text-slate-900">Tuk<span class="text-amber-500">Track</span></span>
            <p class="text-slate-500 text-sm">Secure Driver Portal Connection</p>
        </div>
        
        <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-xs space-y-4">
            <h2 class="text-lg font-bold text-slate-800">Driver Login / Sign Up</h2>
            
            <div>
                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" placeholder="driver@email.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
            </div>
            
            <div>
                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
            </div>
            
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="signIn()" class="w-full bg-slate-900 text-white text-xs font-bold p-3.5 rounded-xl text-center hover:bg-slate-800 transition-all cursor-pointer">Driver Log In</button>
                <button onclick="signUp()" class="w-full bg-slate-100 text-slate-700 text-xs font-bold p-3.5 rounded-xl text-center hover:bg-slate-200 transition-all cursor-pointer">Register New</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "{{ SUPABASE_URL }}";
        const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            const token = localStorage.getItem('driver_token');
            if (token) {
                window.location.href = "/dashboard/";
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("Please enter both email and password.");

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("Error signing up: " + error.message);
            else {
                alert("Sign up successful! If your account is auto-confirmed, you can log in now.");
            }
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("Please enter both email and password.");

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Login failed: " + error.message);
            } else {
                const token = data.session.access_token;
                localStorage.setItem('driver_token', token);
                
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                window.location.href = "/dashboard/";
            }
        }
    </script>
</body>
</html>
