<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TukTrack - Detailed History</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>body { font-family: sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

    <nav class="sticky top-0 z-40 bg-white border-b border-slate-100 px-4 py-3 shadow-xs">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <a href="/dashboard/" class="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 font-bold text-sm cursor-pointer">
                <span>←</span> Back to Dashboard
            </a>
            <span class="font-extrabold text-sm tracking-tight text-slate-900">Ride & Fuel Logs</span>
        </div>
    </nav>

    <main class="flex-grow max-w-xl w-full mx-auto px-4 py-6 space-y-4">
        
        <section class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs space-y-3">
            <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400">Filter History Range</h3>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Start Date</label>
                    <input type="date" id="history-start-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-bold font-mono focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">End Date</label>
                    <input type="date" id="history-end-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-bold font-mono focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
                </div>
            </div>
            
            <div class="pt-1">
                <input type="text" id="history-search" oninput="filterHistoryList()" placeholder="🔍 Search notes (e.g. Airport, Market)..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
            </div>

            <button onclick="fetchCustomHistoryRange()" class="w-full mt-1 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold p-3 rounded-xl cursor-pointer transition-colors text-center shadow-xs">
                Apply Date Filters
            </button>
        </section>

        <section id="custom-summary-card" class="hidden bg-slate-900 text-white rounded-2xl p-4 flex justify-between items-center font-mono">
            <div>
                <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-sans font-bold">Selected Period Net</span>
                <span id="custom-net" class="text-xl font-black text-white">0.00</span>
            </div>
            <div class="text-right text-xs space-y-0.5 text-slate-300 font-sans font-semibold">
                <p>Fares: <span id="custom-fares" class="text-emerald-400 font-mono font-bold">0.00</span></p>
                <p>Fuel: <span id="custom-fuel" class="text-orange-400 font-mono font-bold">0.00</span></p>
            </div>
        </section>

        <section class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs space-y-2">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-sm text-slate-800">📋 Filtered Records</h3>
                <span id="record-count" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-sm font-mono">0 Logs</span>
            </div>

            <div id="history-loading-msg" class="text-center py-8 text-xs font-semibold text-slate-400">
                Select a date range above to pull records.
            </div>

            <div id="history-list" class="divide-y divide-slate-100 hidden">
                </div>
        </section>
    </main>

    <script>
        let fullHistoryDataset = [];

        window.onload = function() {
            const token = localStorage.getItem('driver_token');
            if (!token) { window.location.href = "/home/"; return; }
            
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const today = now.toISOString().split('T')[0];
            
            document.getElementById('history-start-date').value = firstDay;
            document.getElementById('history-end-date').value = today;

            fetchCustomHistoryRange();
        }

        async function fetchCustomHistoryRange() {
            const token = localStorage.getItem('driver_token');
            const start = document.getElementById('history-start-date').value;
            const end = document.getElementById('history-end-date').value;

            if (!start || !end) { alert("Please complete both date fields."); return; }

            const loader = document.getElementById('history-loading-msg');
            const listContainer = document.getElementById('history-list');
            const summaryCard = document.getElementById('custom-summary-card');

            loader.innerText = "Querying log database...";
            loader.classList.remove('hidden');
            listContainer.classList.add('hidden');
            summaryCard.classList.add('hidden');

            try {
                const response = await fetch('/api/dashboard-summary/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("Could not fetch reports");

                const data = await response.json();
                
                const sourceLogs = data.month?.logs || [];
                const currency = data.month?.currency || 'LKR';

                const startBoundary = new Date(start + "T00:00:00");
                const endBoundary = new Date(end + "T23:59:59");

                fullHistoryDataset = sourceLogs.filter(log => {
                    const checkDate = new Date(log.timestamp);
                    return checkDate >= startBoundary && checkDate <= endBoundary;
                });

                renderHistoryLogs(currency);

            } catch(err) {
                console.error(err);
                loader.innerText = "Could not pull historical data.";
            }
        }

        function renderHistoryLogs(currency) {
            const loader = document.getElementById('history-loading-msg');
            const listContainer = document.getElementById('history-list');
            const summaryCard = document.getElementById('custom-summary-card');
            
            loader.classList.add('hidden');
            
            if(fullHistoryDataset.length === 0) {
                loader.innerText = "No logs found matching this criteria.";
                loader.classList.remove('hidden');
                return;
            }

            let totalFares = 0;
            let totalFuel = 0;
            let feedHtml = '';

            fullHistoryDataset.forEach(log => {
                const logObjDate = new Date(log.timestamp);
                const localDateStr = logObjDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
                const localTimeStr = logObjDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                if (log.type === 'fare') {
                    totalFares += log.amount;
                    feedHtml += `
                    <div class="flex justify-between items-center py-3.5 border-b border-slate-100 last:border-0 history-item-row" data-desc="${log.description.toLowerCase()}">
                        <div class="flex items-center gap-3 text-left">
                            <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm font-bold">📥</div>
                            <div>
                                <p class="font-bold text-sm text-slate-800">${log.description}</p>
                                <p class="text-[11px] font-semibold text-slate-400 font-mono">${localDateStr} • ${localTimeStr} • Fare Entry</p>
                            </div>
                        </div>
                        <span class="font-mono font-black text-sm text-emerald-600">+${currency} ${log.amount.toFixed(2)}</span>
                    </div>`;
                } else {
                    totalFuel += log.amount;
                    feedHtml += `
                    <div class="flex justify-between items-center py-3.5 border-b border-slate-100 last:border-0 history-item-row" data-desc="${log.description.toLowerCase()}">
                        <div class="flex items-center gap-3 text-left">
                            <div class="w-9 h-9 rounded-xl bg-orange-50 text-orange-600 flex items-center justify-center text-sm font-bold">⛽</div>
                            <div>
                                <p class="font-bold text-sm text-slate-800">${log.description}</p>
                                <p class="text-[11px] font-semibold text-slate-400 font-mono">${localDateStr} • ${localTimeStr} • Gas Refill</p>
                            </div>
                        </div>
                        <span class="font-mono font-black text-sm text-rose-500">-${currency} ${log.amount.toFixed(2)}</span>
                    </div>`;
                }
            });

            const netChange = totalFares - totalFuel;
            document.getElementById('custom-net').innerText = `${netChange >= 0 ? '+' : ''}${currency} ${netChange.toFixed(2)}`;
            document.getElementById('custom-fares').innerText = `${currency} ${totalFares.toFixed(2)}`;
            document.getElementById('custom-fuel').innerText = `${currency} ${totalFuel.toFixed(2)}`;
            document.getElementById('record-count').innerText = `${fullHistoryDataset.length} Logs`;

            listContainer.innerHTML = feedHtml;
            listContainer.classList.remove('hidden');
            summaryCard.classList.remove('hidden');
        }

        function filterHistoryList() {
            const query = document.getElementById('history-search').value.toLowerCase().trim();
            const rows = document.querySelectorAll('.history-item-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const textContent = row.getAttribute('data-desc') || '';
                if (textContent.includes(query)) {
                    row.style.display = 'flex';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            document.getElementById('record-count').innerText = `${visibleCount} Match${visibleCount !== 1 ? 'es' : ''}`;
        }
    </script>
</body>
</html>
